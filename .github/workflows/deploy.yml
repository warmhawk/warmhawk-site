# warmhawk-site is the one WarmHawk surface that gets deployed centrally — a Coolify-managed
# host. warmhawk-core-engine and warmhawk-enterprise-operator deliberately do NOT use a workflow
# like this: neither has a vendor-operated production target (customers deploy those themselves
# via install.sh).
#
# This repo goes public at go-live, so this workflow is self-contained (no private, internally-
# owned reusable-deploy dependency) — it triggers Coolify directly via webhook and polls for
# health, both with plain curl.
#
# push(master) only happens via a merged stage -> master PR in the three-branch model this repo
# adopts (see ci.yml) — that PR's pull_request(master) CI run already re-verified the merge ref
# before it landed, so this workflow doesn't re-run the full CI suite itself; it just triggers the
# deploy and confirms the app comes back healthy.
#
# Deploy target: SaS-Primary (Coolify server UUID c6tjmvxhv8ruaqkvxruohonv, 157.180.125.116 —
# already hosts other apps). This workflow has no server-specific config itself — the target is
# entirely determined by which Coolify Application resource COOLIFY_WEBHOOK_URL points at, set
# once when that resource is created on the Coolify side, not here. IMPORTANT when creating that
# resource: SaS-Primary has no Traefik/proxy configured yet — an existing hand-built WAF nginx at
# /opt/edge-nginx owns 80/443 instead. Do NOT let Coolify auto-provision a domain/proxy for this
# resource; route it through the existing edge-nginx or it will collide with that setup.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

      - name: Wait for the app to come back healthy
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://warmhawk.com/ || true)
            if [ "$status" = "200" ]; then
              echo "Healthy (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i: HTTP $status, retrying in 10s..."
            sleep 10
          done
          echo "App did not become healthy in time"
          exit 1

    # Expects COOLIFY_WEBHOOK_URL / COOLIFY_API_TOKEN configured as repo secrets. Until those are
    # set on the real GitHub repo, the trigger step fails fast and cleanly — deliberate, not a bug.
