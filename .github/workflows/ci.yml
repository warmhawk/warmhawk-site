# CI — self-contained (no shared/external reusable-workflow dependency). This repo goes public
# at go-live, so its CI must not point at any private, internally-owned template repo.
#
# main -> stage -> master branch-promotion model: warmhawk-site is the one WarmHawk repo with a
# real live deploy step to gate (see deploy.yml) — main is the only branch accepting direct
# commits; a PR into stage or master re-verifies the merge ref via pull_request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [stage, master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_NOTIFY_USER_LIST: ''

  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only — no real secrets used or needed to produce a build.
          STRIPE_SECRET_KEY: 'sk_test_placeholder'
          STRIPE_WEBHOOK_SECRET: 'whsec_placeholder'
